# release-plz — per-crate SemVer + CHANGELOG from Conventional Commits (scope = crate name).
# Posture: release processing and crates.io publishing are opt-in per package
# via the [[package]] overrides below — never flip the workspace defaults. Several
# workspace crate names (ethernet, arp, udp, ip, dns, …) exist on crates.io as unrelated
# projects, so a blanket publish would attempt uploads to names we do not own.
[workspace]
# Isolate bnb releases. Other pending releases remain in history until
# their versions, changelogs, ownership, and release scope are reviewed.
release = false
publish = false
# TODO: migrate version discovery to `git_only = true` after establishing a
# packageable tag baseline. The latest tags predate the path + version manifest
# cleanup below, so release-plz cannot package their historical workspaces.
git_release_enable = false
git_tag_enable = true
# Name-prefixed tags so the many crates' tags never collide and map back to their crate.
git_tag_name = "{{ package }}-v{{ version }}"
# Only cut tags after merging a release-plz PR. This is safer with the repo's
# squash-merge workflow and keeps ordinary pushes to main from releasing.
release_always = false
# Release consumer-facing features, fixes, performance work, documentation,
# reverts, and any explicitly breaking Conventional Commit. Lockfile-only
# build(deps) and chore(deps) commits remain visible in git without cascading
# patch releases through every dependent workspace crate.
release_commits = '^(feat|fix|perf|docs|revert)[(:]|^[a-z]+(?:\([^)]*\))?!:'

# Only the codec pair is currently enabled for release processing.
# The bitsandbytes runtime cannot be published (or verified) without its proc-macro
# crate on the registry. The release job supplies the CARGO_REGISTRY_TOKEN secret
# (see .github/workflows/release-plz.yml).
[[package]]
name = "bitsandbytes-macros"
release = true
publish = true

[[package]]
name = "bitsandbytes"
release = true
publish = true

# Preserve netlink's registry opt-in, but inherit release = false. Re-enabling
# requires review of its breaking synchronous-transport change and version.
[[package]]
name = "rsl-netlink"
publish = true
