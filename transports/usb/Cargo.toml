[package]
name = "usb"
version = "0.0.0"
description = "Owned USB host access: find, open, reset and claim devices, and queue bulk, interrupt and control transfers. Linux usbfs backend."
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
## Readiness registration with a caller-owned Mio reactor.
mio = ["dep:mio"]

[target.'cfg(target_os = "linux")'.dependencies]
mio = { workspace = true, optional = true, features = ["os-ext"] }
rustix = { workspace = true, features = ["event", "fs", "mm"] }
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
