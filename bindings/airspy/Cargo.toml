[package]
name = "airspy"
description = "Rust bindings for libairspy (RawSocket Labs fork of airspy-rs 0.4.0)"
version = "0.4.0"
edition = "2021"
authors = ["Adam Greig <adam@adamgreig.com>"]
homepage = "https://github.com/adamgreig/airspy-rs"
repository = "https://github.com/RawSocketLabs/rsl"
readme = "README.md"
keywords = ["sdr", "airspy", "ffi"]
license = "MIT"
# Forked from the upstream crate of the same name on crates.io; never publish
# under it.
publish = false

[dependencies]
num-complex = "0.4"
thiserror = "2"
