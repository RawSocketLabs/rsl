[package]
name = "airspy"
description = "Rust bindings for libairspy (RawSocket Labs fork of airspy-rs 0.4.0)"
version = "0.4.0"
# Upstream's (implicit) edition; the code predates 2018.
edition = "2015"
authors = ["Adam Greig <adam@adamgreig.com>"]
homepage = "https://github.com/adamgreig/airspy-rs"
repository = "https://github.com/RawSocketLabs/rsl"
readme = "README.md"
keywords = ["sdr", "airspy", "ffi"]
license = "MIT"
# Forked from the upstream crate of the same name on crates.io; never publish
# under it.
publish = false

[dependencies]
# Pinned from upstream's `"*"` wildcards: wildcard requirements force a
# registry-index lookup even for offline `cargo check` and can resolve to
# ancient majors (the old lockfile had libc 0.1). Only `c_void`/`c_int`/
# `c_char` and `num::Complex` are used, so the current majors are all that
# is needed.
libc = "0.2"
num = "0.4"
