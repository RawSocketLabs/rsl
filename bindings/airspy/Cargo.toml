[package]
name = "airspy"
description = "Rust bindings for libairspy (RawSocket Labs fork of airspy-rs 0.4.0)"
version = "0.5.0"
edition = "2024"
rust-version = "1.85"
authors = ["Adam Greig <adam@adamgreig.com>"]
homepage = "https://github.com/adamgreig/airspy-rs"
repository = "https://github.com/RawSocketLabs/rsl"
readme = "README.md"
keywords = ["sdr", "airspy", "ffi"]
license = "MIT"
# Forked from the upstream crate of the same name on crates.io; never publish
# under it.
publish = false

[dependencies]
num-complex = "0.4"
thiserror = "2"

# Mirrors the root [workspace.lints] until this crate joins the workspace, plus
# the FFI rule; replace with `[lints] workspace = true` then.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "warn"
missing_docs = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_inception = "allow"
upper_case_acronyms = "allow"
print_stdout = "warn"
print_stderr = "warn"
# Every remaining FFI call states the invariant it relies on.
undocumented_unsafe_blocks = "warn"
