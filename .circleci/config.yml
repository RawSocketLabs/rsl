# Setup workflow: select affected coverage, then continue the pipeline with only the selected
# jobs (scripts/ci/circleci.py). Unrelated profiles and fuzz targets are never scheduled.
# Requires "Enable dynamic config using setup workflows" in the project's advanced settings.
version: 2.1
setup: true

parameters:
  full:
    description: Run routine checks for all packages (does not enable release jobs).
    type: boolean
    default: false
  base:
    description: Comparison base for an affected run; absent means full coverage.
    type: string
    default: ''
  release:
    description: Qualify products with version changes; this does not authorize publication.
    type: boolean
    default: false
  products:
    description: Explicit enabled product/version groups, space-separated (manual release qualification).
    type: string
    default: ''
  audit:
    description: Run only the dependency advisory scan (the weekly schedule sets this).
    type: boolean
    default: false
  resource_class:
    description: Resource class for check and fuzz jobs; a namespace/name class selects a self-hosted container runner, and auto picks the MS-01 runner when its heartbeat is fresh, else medium.
    type: string
    default: auto

jobs:
  plan:
    docker:
      # The small plan image (.circleci/image/plan.Dockerfile), by digest: a fresh machine pulls
      # ~100 MB, not the full job image scripts/ci/circleci.py pins for every other job.
      - image: ghcr.io/rawsocketlabs/rsl-ci-plan@sha256:0d7a41675188fb151c7130d13a3094447f016ea0cdf301e8fd92c967140ca2e6
    resource_class: medium
    environment:
      CI_TEMP: /tmp/ci
      CI_INPUT_FULL: << pipeline.parameters.full >>
      CI_INPUT_BASE: << pipeline.parameters.base >>
      CI_INPUT_RELEASE: << pipeline.parameters.release >>
      CI_INPUT_PRODUCTS: << pipeline.parameters.products >>
      CI_INPUT_CLASS: << pipeline.parameters.resource_class >>
      CI_INPUT_AUDIT: << pipeline.parameters.audit >>
      CI_TRIGGER_SOURCE: << pipeline.trigger_source >>
      CI_BASE_REVISION: << pipeline.git.base_revision >>
      # GitHub App pipelines leave base_revision unset; these find the previous trunk pipeline.
      CI_PIPELINE_NUMBER: << pipeline.number >>
      CI_PROJECT_SLUG: << pipeline.project.slug >>
    steps:
      - checkout
      - run:
          name: Fetch the trunk
          # Retried: a lost connection here would otherwise fail the whole pipeline.
          command: |
            for delay in 5 15 0; do
              git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main && exit 0
              sleep "$delay"
            done
            exit 1
      - run:
          name: Select packages, profiles, and fuzz targets, then continue
          command: python3 scripts/ci/circleci.py plan
      - store_artifacts:
          path: /tmp/ci

workflows:
  setup:
    jobs:
      - plan
