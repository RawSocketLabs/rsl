[package]
name = "socks"
version = "0.1.0"
edition = "2021"

[dependencies]
binrw = "0.15.0"
derive_builder = "0.20.0"
thiserror = "1.0"
# Structured logging/spans via the tracing facade. With no subscriber
# installed the instrumentation is near-free (a cached atomic check per call
# site). Consumers who want it fully compiled out can set, in their own
# manifest: tracing = { version = "0.1", features = ["release_max_level_off"] }
tracing = "0.1"

[dev-dependencies]
tracing-subscriber = "0.3"
# Statistical benchmarking with HTML reports.
criterion = { version = "0.5", features = ["html_reports"] }
# Sampling profiler wired into criterion: `--profile-time <secs>` emits a
# flamegraph SVG per benchmark instead of measuring.
pprof = { version = "0.13", features = ["flamegraph", "criterion"] }

[[bench]]
name = "socks_bench"
harness = false
