[workspace]
resolver = "2"
members = [
    # codec (published as `bitsandbytes` + `bitsandbytes-macros`)
    "bitsandbytes/bnb",
    "bitsandbytes/bnb-macros",
    # raw-packet I/O
    "rawsock",
    # independent accuracy-first domains
    "crypto",
    "crypto-legacy",
    # ASN.1 transport, X.509 structures, and PKI validation
    "pki/asn1",
    "pki/x509",
    "pki/validation",
    "compression",
    "error-correction",
    # RF parsing
    "rfus",
    # protocol implementations (by OSI layer)
    "protocols/link/ethertype",
    "protocols/link/ethernet",
    "protocols/link/arp",
    "protocols/transport/tcp",
    "protocols/transport/udp",
    "protocols/network/ip",
    "protocols/network/icmp",
    "protocols/application/dns",
    # Linux kernel/userspace protocols
    "protocols/system/netlink",
    # facades
    "rsl",
    "rsl-deps",
    # runnable dual-use demos (privileged injection)
    "demos",
]
# FFI crates (need a C++ toolchain + system libs) and the bnb/crypto fuzz and no_std helpers are excluded
# from the default workspace build; each is built on its own in a dedicated CI job.
exclude = [
    "usdr",
    "rust-dsdcc",
    "bitsandbytes/fuzz",
    "bitsandbytes/bnb/nostd-check",
    "crypto/fuzz",
]

# Shared package metadata — members inherit with `field.workspace = true`. All crates now live
# in the `rsl` monorepo, so `repository` points there; individual crates keep their own
# `version` (e.g. bitsandbytes is 0.2.0) by declaring it explicitly.
[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/RawSocketLabs/rsl"
rust-version = "1.85"

# Single source of truth for dependency versions across the workspace. Inter-crate deps carry
# BOTH `path` (used in-workspace) AND `version` (used by crates.io consumers once published).
[workspace.dependencies]
# --- owned, in-workspace (path + version) ---
bnb = { package = "bitsandbytes", path = "bitsandbytes/bnb", version = "0.3.2", default-features = false }
bnb-macros = { package = "bitsandbytes-macros", path = "bitsandbytes/bnb-macros", version = "0.3.2" }
rawsock = { path = "rawsock", version = "0.1.2", default-features = false }
rsl-deps = { path = "rsl-deps", version = "0.1.0", default-features = false }
rsl-netlink = { path = "protocols/system/netlink", version = "0.1.0", default-features = false }
rsl-crypto = { path = "crypto", version = "0.1.0", default-features = false }
rsl-crypto-legacy = { path = "crypto-legacy", version = "0.1.0", default-features = false }
rsl-asn1 = { path = "pki/asn1", version = "0.1.0", default-features = false }
rsl-x509 = { path = "pki/x509", version = "0.1.0", default-features = false }
rsl-pki = { path = "pki/validation", version = "0.1.0", default-features = false }
rsl-compression = { path = "compression", version = "0.1.0", default-features = false }
rsl-error-correction = { path = "error-correction", version = "0.1.0", default-features = false }

# --- blessed externals used directly by owned crates ---
# thiserror can't be routed through rsl-deps (its derive hardcodes the `thiserror` crate name).
thiserror = "2.0"
# bnb's optional runtime deps.
tracing = "0.1"
bytes = "1"
rustix = { version = "1", features = ["net"] }
libc = "0.2"
zeroize = "1"

# --- bnb proc-macro deps ---
syn = "3.0"
quote = "1.0"
proc-macro2 = "1.0"
proc-macro-crate = "3"

# --- dev / bench / example deps (bnb) ---
trybuild = "1.0"
proptest = "1"
criterion = "0.8"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }
bitbybit = "2.0"
arbitrary-int = "2.1"
modular-bitfield-msb = "0.11"
tokio = { version = "1", features = ["rt", "net", "io-util", "macros", "sync", "time"] }
tokio-util = { version = "0.7", features = ["codec", "net"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Independent SHA-256 oracle used only by rsl-crypto's differential tests.
sha2 = { version = "0.11.0", default-features = false }
# Independent SHA-3/SHAKE oracle used only by rsl-crypto's differential tests.
sha3 = { version = "0.12.0", default-features = false }
shake = { version = "0.1.0", default-features = false }
# Independent HMAC oracle used only by rsl-crypto's differential tests.
hmac = { version = "0.13.0", default-features = false }
# Independent HKDF oracle used only by rsl-crypto's differential tests.
hkdf = { version = "0.13.0", default-features = false }
# Independent AES oracle used only by rsl-crypto's differential tests.
aes = { version = "0.9.2", default-features = false }
# Independent GHASH oracle used only by rsl-crypto's differential tests.
ghash = { version = "0.6.0", default-features = false }
# Independent AES-128-GCM oracle used only by rsl-crypto's differential tests.
aes-gcm = { version = "0.11.1", default-features = false, features = ["aes"] }
# Independent X25519 oracle used only by rsl-crypto's differential tests.
x25519-dalek = { version = "3.0.0", default-features = false }
# Independent Ed25519 oracle used only by rsl-crypto's differential tests.
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["signature", "digest"] }
# Independent ChaCha20-Poly1305 oracle used only by rsl-crypto's differential tests.
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc"] }
# Independent P-256 and P-384 ECDH/ECDSA oracles used only by rsl-crypto's differential tests.
p256 = { version = "0.14.0", default-features = false, features = ["arithmetic", "ecdh", "ecdsa"] }
p384 = { version = "0.14.0", default-features = false, features = ["arithmetic", "ecdh", "ecdsa"] }
# Independent historical-digest oracles used only by rsl-crypto-legacy tests.
sha1 = { version = "0.11.0", default-features = false }
md5 = { package = "md-5", version = "0.11.0", default-features = false }
# Independent RC4 oracle used only by rsl-crypto-legacy tests.
rc4 = { version = "0.2.0", default-features = false }
# Independent DES/Triple-DES oracle used only by rsl-crypto-legacy tests.
des = { version = "0.9.0", default-features = false }
# Independent arbitrary-precision oracle used only by rsl-crypto's RSA integer tests. The library's
# RSA implementation does not depend on this package.
num-bigint-dig = { version = "0.9.1", default-features = false, features = ["std"] }

# Common lints. Unsafe policy is the softer `unsafe_op_in_unsafe_fn = deny` (protocols allows
# isolated unsafe for future raw I/O); bnb/rawsock pin the stricter `#![forbid(unsafe_code)]`
# at crate level, so a single shared table serves all three.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_inception = "allow"
upper_case_acronyms = "allow"
print_stdout = "warn"
print_stderr = "warn"
