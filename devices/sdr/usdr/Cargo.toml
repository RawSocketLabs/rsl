[package]
name = "rsl-usdr"
version = "0.0.0"
description = "Pure-Rust driver for the Wavelet Lab uSDR software-defined radio."
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
bnb.workspace = true
num-complex.workspace = true
rsl-deps = { workspace = true, features = ["tracing"] }
thiserror.workspace = true

[features]
## The PCIe transport over the `usdr_pcie_uram` Linux driver (`transport::pcie`).
pcie = ["dep:rsl-usdr-pcie"]
## USB control-plane access and RX streaming over the owned Linux usbfs backend.
usb = ["dep:rsl-usb"]

[target.'cfg(target_os = "linux")'.dependencies]
rsl-usdr-pcie = { workspace = true, optional = true }
rsl-usb = { workspace = true, optional = true }

[dev-dependencies]
rsl-usdr-sim.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
# Readiness-runner proof over a fake source; no Mio dependency in production/core APIs.
mio.workspace = true

[lints]
workspace = true
