[package]
name = "usdr"
version = "0.0.0"
description = "Pure-Rust driver for the Wavelet Lab uSDR software-defined radio."
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
bnb.workspace = true
num-complex.workspace = true
sdr-cal.workspace = true
sdr-gearbox.workspace = true
sdr-formats.workspace = true
hal = { workspace = true, features = ["std"] }
lp8758.workspace = true
sdr-frontend = { workspace = true, features = ["std"] }
sdr-stream.workspace = true
deps = { workspace = true, features = ["tracing"] }
thiserror.workspace = true

[features]
## The PCIe transport over the `usdr_pcie_uram` Linux driver (`transport::pcie`).
pcie = ["dep:usdr-pcie"]
## USB control-plane access and RX streaming over the owned Linux usbfs backend.
usb = ["dep:usb"]
## Unstable `transport::usb::NativeUsb`: the USB control plane driven by a caller-owned Mio
## reactor.
mio = ["usb", "dep:mio", "usb/mio"]
## The Verilator host bridge (`transport::verilator`): a simulated uSDR gateware model over
## libusdr's Unix-socket and shared-file protocol.
verilator = []

[target.'cfg(target_os = "linux")'.dependencies]
usdr-pcie = { workspace = true, optional = true }
usb = { workspace = true, optional = true }
mio = { workspace = true, optional = true }

[dev-dependencies]
usdr-sim.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
# Readiness-runner proofs; Mio enters production only through the opt-in `mio` feature. The
# native pilot's fake registers a raw socket.
mio = { workspace = true, features = ["os-ext"] }

[lints]
workspace = true
