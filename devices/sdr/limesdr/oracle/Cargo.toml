[package]
name = "limesdr-oracle"
version = "0.0.0"
description = "Runs wavelet-lab libusdr's LimeSDR-mini (u3_limesdr) driver against limesdr-sim, as the reference for the LimeSDR port."
publish = false
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/RawSocketLabs/rsl"
rust-version = "1.85"
links = "limesdr_oracle"

# Its own workspace root: it compiles vendored C, which the root workspace must not build.
[workspace]

[dependencies]
limesdr-sim = { path = "../sim" }
thiserror = "2.0"

[dev-dependencies]
limesdr = { path = ".." }

[build-dependencies]
cc = "1.2"

# Detached from the workspace (it compiles vendored C), so the root `[workspace.lints]` policy
# is restated here, plus `undocumented_unsafe_blocks` for the FFI.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "warn"
missing_docs = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_inception = "allow"
upper_case_acronyms = "allow"
print_stdout = "warn"
print_stderr = "warn"
undocumented_unsafe_blocks = "warn"
