[package]
name = "sdr-frontend"
version = "0.0.0"
description = "libusdr's front-end board probe and the boards it brings up, shared by the pure-Rust SDR drivers."
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
bnb.workspace = true
lmk05318.workspace = true
hal.workspace = true
deps = { workspace = true, optional = true, features = ["tracing"] }
thiserror = { workspace = true, optional = true }

[features]
## The blocking probe over `hal`'s `Bus`, the boards' bring-ups (logging, through
## `tracing`, the events libusdr logs) and `Error`.
std = ["hal/std", "lmk05318/std", "dep:deps", "dep:thiserror"]

[lints]
workspace = true
