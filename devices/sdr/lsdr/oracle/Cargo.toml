[package]
name = "rsl-lsdr-oracle"
version = "0.0.0"
description = "Runs wavelet-lab libusdr's LSDr (m2_da09_4_ad45_2) driver against rsl-lsdr-sim, as the reference for the LSDr port."
publish = false
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/RawSocketLabs/rsl"
rust-version = "1.85"
links = "lsdr_oracle"

# Its own workspace root: it compiles vendored C, which the root workspace must not build, and
# sits inside the `rsl-lsdr` member's directory, where the root workspace's `exclude` cannot
# reach it.
[workspace]

[dependencies]
rsl-lsdr-sim = { path = "../sim" }
thiserror = "2.0"

[dev-dependencies]
rsl-lsdr = { path = ".." }

[build-dependencies]
cc = "1.2"

# Detached from the workspace (it compiles vendored C), so the root `[workspace.lints]` policy
# is restated here, plus `undocumented_unsafe_blocks` for the FFI.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "warn"
missing_docs = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_inception = "allow"
upper_case_acronyms = "allow"
print_stdout = "warn"
print_stderr = "warn"
undocumented_unsafe_blocks = "warn"
