[package]
name = "pe-sync-oracle"
version = "0.0.0"
description = "Runs wavelet-lab libusdr's PE_SYNC driver against pe-sync-sim, as the reference for the PE_SYNC port."
publish = false
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/RawSocketLabs/rsl"
rust-version = "1.85"
links = "pe_sync_oracle"

# Its own workspace root: it compiles vendored C, which the root workspace must not build.
[workspace]

[dependencies]
pe-sync-sim = { path = "../sim" }
thiserror = "2.0"

[dev-dependencies]
pe-sync = { path = ".." }
# chip_parity.rs compiles pe-sync's private src/portable tree, which needs its crates.
bnb = { package = "bitsandbytes", path = "../../../../codecs/bitsandbytes/bnb" }
lmk05318 = { path = "../../../chips/lmk05318" }
hal = { path = "../../../hal", features = ["std"] }

[build-dependencies]
cc = "1.2"

# Detached from the workspace (it compiles vendored C), so the root `[workspace.lints]` policy
# is restated here, plus `undocumented_unsafe_blocks` for the FFI.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "warn"
missing_docs = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_inception = "allow"
upper_case_acronyms = "allow"
print_stdout = "warn"
print_stderr = "warn"
undocumented_unsafe_blocks = "warn"
