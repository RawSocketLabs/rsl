[package]
name = "sangfor-atrust"
version = "0.1.0"
description = "Sangfor aTrust VPN client protocol: the access policy, password login and the TCP tunnel, with an optional network layer."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = []
aes-gcm-accel = ["crypto/aes-gcm-accel"]
# Request prompt acknowledgments when a Linux tunnel needs more TLS data.
tcp-quickack = ["net", "dep:rustix"]
# Sockets, TLS and HTTP: what a client needs to reach a real gateway. Without it the crate is
# the protocol alone, driven through `api::Portal` and `tcp::Transport`.
net = ["dep:tls"]

[dependencies]
cookie.workspace = true
# The random source a login draws trace ids and padding from; nothing here names an OS RNG.
crypto.workspace = true
http1.workspace = true
# The tunnel's wire types report a short buffer through bnb's error type.
bnb = { workspace = true, features = ["std"] }
sangfor-atrust-sig.workspace = true
sangfor-atrust-wire.workspace = true
serde.workspace = true
# The policy document is JSON whose key spelling is not fixed, so it is walked as a value;
# the anti-MITM object is signed over its text as received, so it is kept raw.
serde_json = { workspace = true, features = ["raw_value"] }
thiserror.workspace = true
tls = { workspace = true, optional = true }
# The query string of every request, in the one encoding the request signature covers.
uri.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { workspace = true, optional = true }

[dev-dependencies]
# Parse the loopback CA for TLS path verification.
x509.workspace = true
# RSA decryption, to read back the password a scripted gateway was sent.
crypto-legacy.workspace = true
# The operating system's generator, for the example that talks to a real gateway.
os-random.workspace = true

[[test]]
name = "interop"
required-features = ["net"]

[[example]]
name = "tunnel"
required-features = ["net"]

[lints]
workspace = true
