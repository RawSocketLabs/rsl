schema = 1
id = "dependencies"
title = "RSL dependency facade and pre-approved set"
strength = "SHOULD"
scope = "RawSocket Labs Rust repositories that adopt RSL dependency policy"
rule = "Check the `deps` facade crate (`deps/`) before proposing a normal external dependency, and when going outside it explain why the facade cannot express the needed feature or MSRV contract; preserve its optional features, empty defaults, registry sources and canonical re-exports, and treat a new facade capability as a broad dependency change. Treat a crate already carried by the `deps` facade crate (`deps/`) as having owner direction under CORE-DEP-001 when it is used for the capability `deps` carries it for, with default features disabled and only the needed features enabled; state the crate and features in the change description; and obtain owner direction as usual for any crate `deps` does not carry, for a new feature that expands the resolved graph materially, and for any MSRV, unsafe-exposure, or license change."
applies_when = ["Adding a direct, development, or build dependency", "Enabling a dependency feature", "Reviewing a manifest or lockfile change"]
exceptions = ["A repository that pins a narrower allow-list or forbids a carried crate", "A no_std, embedded, or safety-critical component whose profile requires per-dependency review", "A higher-precedence repository decision"]
source_rules = ["R68", "R69", "R217"]
