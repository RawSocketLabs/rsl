# cargo-fuzz crate for `rsl-crypto`. Deliberately its **own** workspace (the empty
# `[workspace]` table below) so the unstable libfuzzer-sys toolchain never leaks into the
# parent workspace's stable fmt/clippy/test/deny/MSRV jobs.
# Run from the repo root: `cargo +nightly fuzz run <target> --fuzz-dir crypto/fuzz`.
[package]
name = "rsl-crypto-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.rsl-crypto]
path = ".."

[[bin]]
name = "aead_open"
path = "fuzz_targets/aead_open.rs"
test = false
doc = false
bench = false

[[bin]]
name = "signature_verify"
path = "fuzz_targets/signature_verify.rs"
test = false
doc = false
bench = false

[[bin]]
name = "public_key_parse"
path = "fuzz_targets/public_key_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "digest_fragmentation"
path = "fuzz_targets/digest_fragmentation.rs"
test = false
doc = false
bench = false

[[bin]]
name = "rsa_pss_verify"
path = "fuzz_targets/rsa_pss_verify.rs"
test = false
doc = false
bench = false

# Detach from the parent workspace.
[workspace]
