version: 2
updates:
  # Rust dependencies across the workspace (the shared [workspace.dependencies] + members).
  # Minor/patch bumps are batched into one PR to cut noise; majors get their own PR.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      cargo-minor:
        update-types: [minor, patch]
    ignore:
      # 1.1.5 does not compile with only `net` enabled (rawsock's feature set): its
      # `timespec` module is gated on other features. Drop once a fixed release exists.
      - dependency-name: "rustix"
        versions: ["1.1.5"]

  # The CircleCI job image's base (.circleci/image/Dockerfile). A bump needs a rebuild and a
  # reviewed digest change in scripts/ci/circleci.py and .circleci/config.yml.
  - package-ecosystem: docker
    directory: /.circleci/image
    schedule:
      interval: weekly
