name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
    inputs:
      runner:
        description: >-
          Runner for validation. Start `beefy` with ci-runner RawSocketLabs/rsl -j N.
        type: choice
        options: [blacksmith-4vcpu-ubuntu-2404, beefy]
        default: blacksmith-4vcpu-ubuntu-2404
      full:
        description: Run every validation surface.
        type: boolean
        default: false
      base:
        description: Comparison base for an affected run; absent means full coverage.
        type: string
        default: ''
      release:
        description: Add release checks; this does not authorize publication.
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

# Only obsolete PR runs are cancelled. Main and publisher runs remain independent.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  plan:
    name: select affected coverage
    runs-on: ${{ inputs.runner || 'blacksmith-4vcpu-ubuntu-2404' }}
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      checks: ${{ steps.plan.outputs.checks }}
      fuzz: ${{ steps.plan.outputs.fuzz }}
      has_checks: ${{ steps.plan.outputs.has_checks }}
      has_fuzz: ${{ steps.plan.outputs.has_fuzz }}
      public_api_tool: ${{ steps.plan.outputs.public_api_tool }}
      semver_tool: ${{ steps.plan.outputs.semver_tool }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Probe whether Cargo metadata is needed
        id: probe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_BASE: ${{ inputs.base }}
          INPUT_FULL: ${{ inputs.full }}
          INPUT_RELEASE: ${{ inputs.release }}
        run: python3 scripts/ci/prepare.py --probe
      - uses: dtolnay/rust-toolchain@stable
        if: steps.probe.outputs.needs_cargo == 'true'
      - name: Select packages, profiles, and downstream fuzz targets
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_BASE: ${{ inputs.base }}
          INPUT_FULL: ${{ inputs.full }}
          INPUT_RELEASE: ${{ inputs.release }}
        run: python3 scripts/ci/prepare.py

  policy:
    name: CI policy and workflow syntax
    runs-on: ${{ inputs.runner || 'blacksmith-4vcpu-ubuntu-2404' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Fast tier has no Cargo invocation, builds, registry access, or extra Python dependencies.
      - run: python3 -m unittest discover -s scripts/ci -p 'test_*.py' -v
      - run: bash -n scripts/ci-act.sh
      - uses: docker://rhysd/actionlint:1.7.12

  checks:
    name: checks (${{ matrix.profile }})
    needs: [plan, policy]
    if: needs.plan.outputs.has_checks == 'true'
    runs-on: ${{ inputs.runner || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.checks) }}
    env:
      CI_PLAN: ${{ needs.plan.outputs.plan }}
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        if: matrix.profile != 'deny' && matrix.profile != 'blessed'
        with:
          toolchain: ${{ matrix.toolchain }}
          # trybuild panic snapshots need rust-src. Never silently switch their compiler.
          components: ${{ contains(fromJSON('["workspace","bnb","socks","rust-skills"]'), matrix.profile) && 'rustfmt,clippy,rust-src' || '' }}
          targets: ${{ matrix.profile == 'no-std' && 'thumbv7em-none-eabi' || '' }}
      - uses: dtolnay/rust-toolchain@1.85.0
        if: matrix.profile == 'rust-skills'
      - uses: Swatinem/rust-cache@v2
        if: matrix.profile != 'deny' && matrix.profile != 'blessed'
        with:
          key: checks-${{ matrix.profile }}-${{ matrix.toolchain }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: |
            . -> target
            bitsandbytes/bnb/nostd-check -> target
            tools/rust-skills -> target
            usdr -> target
            rust-dsdcc -> target
      - uses: taiki-e/install-action@v2
        if: matrix.profile == 'public-api'
        with:
          tool: ${{ needs.plan.outputs.public_api_tool }}
      - uses: taiki-e/install-action@v2
        if: matrix.profile == 'semver'
        with:
          tool: ${{ needs.plan.outputs.semver_tool }}
      - name: Native compiler for FFI bridge checks
        if: contains(fromJSON('["usdr","rust-dsdcc"]'), matrix.profile) && inputs.runner != 'beefy'
        run: sudo apt-get update && sudo apt-get install -y build-essential
      - name: Fetch DSDcc headers (compile check only, no hardware/native linking)
        if: matrix.profile == 'rust-dsdcc'
        run: git clone --depth 1 https://github.com/f4exb/dsdcc.git "$RUNNER_TEMP/dsdcc"
      - uses: EmbarkStudios/cargo-deny-action@v2
        if: matrix.profile == 'deny'
      - name: Run the complete selected profile
        if: matrix.profile != 'deny'
        env:
          PROFILE: ${{ matrix.profile }}
          DSDCC_INCLUDE: ${{ runner.temp }}/dsdcc
        run: python3 scripts/ci/run.py "$PROFILE"

  fuzz:
    name: fuzz (${{ matrix.root }}/${{ matrix.target }})
    needs: [plan, policy]
    if: needs.plan.outputs.has_fuzz == 'true'
    runs-on: ${{ inputs.runner || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.fuzz) }}
    env:
      RUSTUP_TOOLCHAIN: nightly
      CI_PLAN: ${{ needs.plan.outputs.plan }}
      FUZZ_ITEM: ${{ toJSON(matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          key: fuzz-${{ matrix.root }}-${{ matrix.target }}-nightly-gnu
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: ${{ matrix.root }} -> target
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      # Separate processes preserve each target's original budget. GNU is required for ASan.
      - run: python3 scripts/ci/run.py fuzz

  ci-ok:
    name: CI
    if: always()
    needs: [plan, policy, checks, fuzz]
    runs-on: ${{ inputs.runner || 'blacksmith-4vcpu-ubuntu-2404' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Probe independent coverage recomputation
        id: probe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_BASE: ${{ inputs.base }}
          INPUT_FULL: ${{ inputs.full }}
          INPUT_RELEASE: ${{ inputs.release }}
        run: python3 scripts/ci/prepare.py --probe
      - uses: dtolnay/rust-toolchain@stable
        if: steps.probe.outputs.needs_cargo == 'true'
      - name: Recompute coverage and reject any unexpected skip, failure, or cancellation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_BASE: ${{ inputs.base }}
          INPUT_FULL: ${{ inputs.full }}
          INPUT_RELEASE: ${{ inputs.release }}
          CI_PLAN: ${{ needs.plan.outputs.plan }}
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci/gate.py ci --report "$RUNNER_TEMP/ci-coverage.json"
      - uses: actions/upload-artifact@v7.0.1
        if: env.ACT != 'true'
        with:
          name: ci-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-coverage.json
          if-no-files-found: error
          retention-days: 30
