# Conventional Commits -> SemVer, automated by release-plz.
#
# Jobs run only after successful push CI for the exact current `main` commit:
#   * release-plz-pr      — opens/updates a "release" PR that bumps each crate's
#                           version (from the commits since its last tag) and
#                           updates its CHANGELOG.md. Merging that PR is what
#                           actually cuts a release.
#   * release-plz-release — when a release PR is merged (Cargo.toml version no
#                           longer matches a tag), creates the git tag(s) and
#                           publishes the crates with both `release = true` and
#                           `publish = true` in release-plz.toml (currently the
#                           bitsandbytes pair). GitHub Releases stay disabled
#                           (`git_release_enable = false`).
#
# RELEASE_PLZ_TOKEN must be a user/App token so the release PR triggers CI.
# A missing token is an error, never a fallback to GITHUB_TOKEN.
name: release-plz

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# Serialize the entire tag/publish/PR sequence, not just PR creation.
concurrency:
  group: release-plz-${{ github.repository }}
  cancel-in-progress: false

jobs:
  candidate:
    name: verify successful CI candidate
    if: >-
      github.repository_owner == 'RawSocketLabs' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      sha: ${{ steps.verify.outputs.sha }}
      publish: ${{ steps.candidate.outputs.publish }}
    steps:
      - name: Verify workflow identity and current main SHA
        id: verify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          CANDIDATE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          run=$(gh api "repos/$REPOSITORY/actions/runs/$RUN_ID")
          jq -e --arg sha "$CANDIDATE_SHA" --arg repository "$REPOSITORY" '
              .path == ".github/workflows/ci.yml" and
              .head_sha == $sha and .event == "push" and .conclusion == "success" and
              .head_branch == "main" and .head_repository.full_name == $repository' <<< "$run"
          main_sha=$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$main_sha" != "$CANDIDATE_SHA" ]; then
            echo "Superseded CI run; wait for the current main commit."
            exit 0
          fi
          echo "sha=$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"
          echo "attempt=$(jq -r .run_attempt <<< "$run")" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        if: steps.verify.outputs.sha != ''
        with:
          ref: ${{ steps.verify.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Identify the exact merged release PR
        id: candidate
        if: steps.verify.outputs.sha != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_SHA: ${{ steps.verify.outputs.sha }}
        run: python3 scripts/ci/gate.py candidate
      - uses: actions/download-artifact@v8.0.1
        if: steps.candidate.outputs.publish == 'true'
        with:
          name: ci-coverage-${{ github.event.workflow_run.id }}-${{ steps.verify.outputs.attempt }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # Treat the receipt as data, outside the executable checkout.
          path: ${{ runner.temp }}/ci-coverage
      - uses: dtolnay/rust-toolchain@stable
        if: steps.candidate.outputs.publish == 'true'
      - name: Require complete exact-run release and downstream qualification
        if: steps.candidate.outputs.publish == 'true'
        env:
          CANDIDATE_SHA: ${{ steps.verify.outputs.sha }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
          CI_RUN_ATTEMPT: ${{ steps.verify.outputs.attempt }}
        run: python3 scripts/ci/gate.py release --report "$RUNNER_TEMP/ci-coverage/ci-coverage.json"

  # Tag a freshly merged release PR and publish the opted-in crates (no GH release).
  release-plz-release:
    name: release-plz release (tags + scoped publish)
    needs: candidate
    runs-on: blacksmith-4vcpu-ubuntu-2404
    if: needs.candidate.result == 'success' && needs.candidate.outputs.publish == 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main
      - name: Fail closed before release side effects
        env:
          CANDIDATE_SHA: ${{ needs.candidate.outputs.sha }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          RELEASE_PLZ_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -n "$CARGO_REGISTRY_TOKEN" || { echo "::error::CARGO_REGISTRY_TOKEN is required"; exit 1; }
          test -n "$RELEASE_PLZ_TOKEN" || { echo "::error::RELEASE_PLZ_TOKEN is required"; exit 1; }
      - uses: dtolnay/rust-toolchain@stable
      - uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # crates.io token for bitsandbytes and bitsandbytes-macros. Other
          # packages, including netlink, are held by release = false in
          # release-plz.toml even if this token has broader publish scope.
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # Open/update the version-bump + CHANGELOG PR.
  release-plz-pr:
    name: release-plz PR
    # The release job creates tags after a release PR merge. Analyze the next
    # release only after that job finishes so git-only version discovery never
    # races against tag creation and regenerates the release that just merged.
    needs: [candidate, release-plz-release]
    if: >-
      always() && needs.candidate.result == 'success' && needs.candidate.outputs.sha != '' &&
      (needs.release-plz-release.result == 'success' || needs.release-plz-release.result == 'skipped')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main
      - name: Require the verified candidate before updating release PRs
        env:
          CANDIDATE_SHA: ${{ needs.candidate.outputs.sha }}
          RELEASE_PLZ_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -n "$RELEASE_PLZ_TOKEN" || { echo "::error::RELEASE_PLZ_TOKEN is required"; exit 1; }
      - uses: dtolnay/rust-toolchain@stable
      - uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
